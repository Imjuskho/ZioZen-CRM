name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ziozen
          POSTGRES_PASSWORD: ziozen_dev_password
          POSTGRES_DB: ziozen
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ziozen -d ziozen"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://ziozen:ziozen_dev_password@localhost:5432/ziozen?schema=public
      JWT_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cd apps/api && npx prisma migrate deploy
      - run: npm run build --workspace=api
      - run: npm run build --workspace=web
      - run: npm run test:e2e --workspace=api
